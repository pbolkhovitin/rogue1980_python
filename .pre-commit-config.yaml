# .pre-commit-config.yaml – place in project root
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: [--line-length=100]

      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: [--profile=black]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: [--strict]
        pass_filenames: true

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        args: ["-v", "--tb=short"]